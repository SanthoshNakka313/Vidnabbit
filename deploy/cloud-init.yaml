#cloud-config
# Hetzner Cloud first-boot setup for the VidNabbit API host (Ubuntu 24.04).
# Paste into "Cloud config" when creating the server. SSH keys only.
package_update: true
package_upgrade: true
packages: [ca-certificates, curl, git, ufw, unattended-upgrades, fail2ban]
users:
  - name: deploy
    groups: [docker]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    # Replace with your public key (the same one you add in Hetzner).
    ssh_authorized_keys: ["ssh-ed25519 AAAA...your-key"]
write_files:
  - path: /etc/ssh/sshd_config.d/10-hardening.conf
    content: |
      PasswordAuthentication no
      PermitRootLogin no
      KbdInteractiveAuthentication no
  - path: /etc/docker/daemon.json
    content: |
      {"live-restore": true, "log-driver": "json-file",
       "log-opts": {"max-size": "20m", "max-file": "5"}, "userland-proxy": false}
runcmd:
  - curl -fsSL https://get.docker.com | sh
  - usermod -aG docker deploy
  - ufw default deny incoming
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - systemctl restart ssh
  - systemctl enable --now unattended-upgrades fail2ban
